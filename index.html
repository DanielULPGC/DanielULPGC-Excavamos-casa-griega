<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Excavamos una casa griega</title>
<link rel="stylesheet" href="vendor/fuentes/fuentes.css">
<style>
:root{
  --bg:#E6F0F4; --scene:#D6E6EE; --panel:#FFFFFF; --ink:#1E2B33; --ink-soft:#4A5A63;
  --line:#C6D4DB; --tag:#FFD35C; --tag-ink:#3A2A00; --idea:#2F6FB0; --idea-soft:#E4EEF8;
  --today:#FFFFFF; --earth:#8A5A3B; --focus:#1F5FA8; --chip:#F1F5F7;
  --display:"Fredoka","Trebuchet MS","Verdana",sans-serif;
  --body:"Atkinson Hyperlegible","Verdana","Segoe UI",sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121C22; --scene:#1A2831; --panel:#1C2830; --ink:#EEF3F5; --ink-soft:#B6C4CB;
    --line:#34454F; --tag:#FFD35C; --tag-ink:#3A2A00; --idea:#8DBEF0; --idea-soft:#1E3348;
    --today:#E9EFF2; --earth:#D59A6E; --focus:#8DBEF0; --chip:#24343E;
  }
}
:root[data-theme="dark"]{
  --bg:#121C22; --scene:#1A2831; --panel:#1C2830; --ink:#EEF3F5; --ink-soft:#B6C4CB;
  --line:#34454F; --tag:#FFD35C; --tag-ink:#3A2A00; --idea:#8DBEF0; --idea-soft:#1E3348;
  --today:#E9EFF2; --earth:#D59A6E; --focus:#8DBEF0; --chip:#24343E;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;}
*,*::before,*::after{box-sizing:inherit;}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;}
button{font:inherit;color:inherit;cursor:pointer;}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,450px);
  grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top" "stage panel";}

/* Cabecera */
.top{grid-area:top;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;
  padding:.7rem 1.1rem;background:var(--panel);border-bottom:1px solid var(--line);}
.brand h1{font-family:var(--display);font-weight:600;font-size:1.55rem;line-height:1.15;margin:0;letter-spacing:.005em;}
.brand p{margin:.1rem 0 0;color:var(--ink-soft);font-size:.95rem;}
.top-actions{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;}
.lang{display:inline-flex;border:2px solid var(--line);border-radius:999px;overflow:hidden;}
.lang button{border:0;background:transparent;padding:.35rem .8rem;font-weight:700;min-width:3rem;min-height:2.5rem;}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--panel);}
.ideas-btn{display:inline-flex;align-items:center;gap:.55rem;border:2px dashed var(--idea);background:var(--idea-soft);
  color:var(--ink);border-radius:999px;padding:.35rem .95rem .35rem .45rem;font-weight:700;min-height:2.5rem;}
.ideas-btn .sw{width:2.3rem;height:1.35rem;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s;}
.ideas-btn .sw::after{content:"";position:absolute;top:.15rem;left:.15rem;width:1.05rem;height:1.05rem;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.3);}
.ideas-btn[aria-pressed="true"] .sw{background:var(--idea);}
.ideas-btn[aria-pressed="true"] .sw::after{transform:translateX(.95rem);}

/* Escenario 3D */
.stage{grid-area:stage;position:relative;overflow:hidden;min-height:0;background:var(--scene);}
#c{display:block;width:100%;height:100%;touch-action:none;}
#c:focus-visible{outline-offset:-4px;}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1;}
.secbar,.legend,.dock,.caption,.toast,.mlabel{z-index:6;}

/* Etiquetas de hallazgo: la firma visual del recurso */
.tag{position:absolute;left:0;top:0;pointer-events:auto;display:inline-flex;align-items:center;gap:.4rem;white-space:nowrap;
  background:var(--tag);color:var(--tag-ink);border:2px solid rgba(58,42,0,.55);border-radius:.35rem .9rem .9rem .35rem;
  padding:.22rem .7rem .22rem 1.35rem;font-weight:700;font-size:.92rem;line-height:1.2;
  box-shadow:0 2px 0 rgba(0,0,0,.22);will-change:transform;}
.tag::before{content:"";position:absolute;left:.45rem;top:50%;width:.45rem;height:.45rem;margin-top:-.225rem;border-radius:50%;
  background:var(--scene);border:2px solid rgba(58,42,0,.55);}
.tag::after{content:"";position:absolute;left:var(--lx,50%);top:100%;width:2px;height:var(--lead,16px);margin-left:-1px;background:rgba(40,30,10,.75);}
.tag .n{font-family:var(--display);font-weight:600;background:rgba(255,255,255,.55);border-radius:.3rem;padding:0 .35rem;min-width:1.4rem;text-align:center;}
.tag.today{background:var(--today);color:#243038;border-color:#7d8b93;}
.tag.today::before{border-color:#7d8b93;}
.tag.zone{background:#fff6d6;border-style:dashed;}
.tag.strata{background:#F3D9B8;}
.tag .pill{display:none;font-size:.75rem;font-weight:700;color:#173e66;background:#e4eef8;border:1.5px dashed #2F6FB0;border-radius:999px;padding:0 .45rem;}
.show-ideas .tag.has-idea .pill{display:inline-block;}
.tag:hover,.tag.hover{filter:brightness(1.05);transform-origin:center;box-shadow:0 3px 0 rgba(0,0,0,.28);}
.tag[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px;}
.tag.off{visibility:hidden;}
.compact .tag .nm,.compact .tag .pill{display:none !important;}
.compact .tag{padding:.2rem .45rem .2rem 1.2rem;min-width:2.1rem;min-height:1.9rem;}
.compact .tag[aria-pressed="true"] .nm,.compact .tag.hover .nm{display:inline !important;}
.ideas-btn .short{display:none;}

/* Controles */
.tline{position:absolute;left:.75rem;right:.75rem;bottom:4rem;display:flex;align-items:center;gap:.7rem;background:var(--panel);border:2px solid var(--line);border-radius:.8rem;padding:.4rem .8rem;z-index:6;box-shadow:0 2px 0 rgba(0,0,0,.12);}
.tline[hidden],.strat[hidden]{display:none;}
.tplay{flex:none;width:2.8rem;height:2.8rem;border-radius:50%;border:2px solid var(--ink);background:var(--ink);color:var(--panel);display:grid;place-items:center;padding:0;}
.tplay svg{width:1.15rem;height:1.15rem;}
.ttrack{flex:1;min-width:0;}
.tsegs{display:flex;font-size:.78rem;font-weight:700;color:var(--ink-soft);}
.tsegs span{display:block;text-align:center;border-bottom:4px solid;padding-bottom:.05rem;white-space:nowrap;overflow:hidden;}
.tsegs .s1{flex:4;border-color:#9a6f4c;}
.tsegs .s2{flex:3;border-color:var(--ink);}
.tline input[type=range]{width:100%;margin:.1rem 0;accent-color:var(--focus);height:1.5rem;cursor:pointer;}
.tticks{display:flex;justify-content:space-between;font-size:.72rem;color:var(--ink-soft);padding:0 .35rem;font-weight:700;}
.strat{position:absolute;left:.75rem;top:6.4rem;width:9.6rem;background:var(--panel);border:2px solid var(--line);border-radius:.8rem;padding:.3rem;z-index:5;overflow:hidden;}
.strat svg{display:block;width:100%;height:auto;}
.strat-in{display:none;}
.planbox{max-width:22rem;margin:.4rem 0;}
.plan{display:block;width:100%;height:auto;}
.plan [data-plan]:focus{outline:none;}
.plan [data-plan]:focus-visible rect{stroke:var(--focus);stroke-width:4;}
.digrow{display:flex;gap:.7rem;align-items:flex-start;}
.digtxt{flex:1;min-width:0;}
.digcol{flex:none;width:6.2rem;height:auto;}
@media (max-width:820px){
  .strat{display:none !important;}
  .strat-in{display:block;max-width:11rem;margin:.5rem 0;}
  .tline{left:.5rem;right:.5rem;bottom:3.9rem;padding:.3rem .55rem;gap:.5rem;}
  .tplay{width:2.5rem;height:2.5rem;}
  .tsegs,.tticks{display:none;}
  .tline{bottom:3.7rem;padding:.3rem .55rem;}
  .time-mode .caption{padding:.25rem .55rem;}
  .time-mode .caption .kind-chip{display:none;}
  .time-mode .caption b{font-size:.9rem;}
}
.conj{position:absolute;inset:0;overflow:auto;background:var(--scene);padding:.4rem .6rem;}
.conj[hidden]{display:none;}
.conj svg{display:block;width:100%;min-width:600px;max-width:840px;height:auto;margin:0 auto;}
.swipe{display:none;}
@media (max-width:820px){.swipe{display:block;position:sticky;left:0;font-size:.8rem;font-weight:700;color:var(--ink-soft);padding:.1rem 0 .3rem;}}
.conj .ly{cursor:pointer;}
.conj .ly:focus{outline:none;}
.conj .ly:focus-visible rect{stroke:var(--focus);stroke-width:5;}
.conj-mode #c,.conj-mode .labels,.conj-mode .dock,.conj-mode .legend,.conj-mode .secbar,.conj-mode .caption,.conj-mode .toast,.conj-mode .mlabel{display:none !important;}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:.7rem;overflow:hidden;margin:.2rem 0;}
.seg button{border:0;background:transparent;padding:.45rem .9rem;font-weight:700;min-height:2.6rem;}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel);}
.phase{margin:.4rem 0;}
.phase input[type=range]{width:100%;margin:.4rem 0;accent-color:var(--focus);}
.chk{display:flex;align-items:center;gap:.5rem;margin:.35rem 0;min-height:2.4rem;}
.chk input{width:1.2rem;height:1.2rem;}
.actions.vert{flex-direction:column;align-items:stretch;}
.secbar{position:absolute;left:.75rem;top:.75rem;display:flex;align-items:center;gap:.3rem;background:var(--panel);
  border:2px solid var(--line);border-radius:.8rem;padding:.3rem .5rem;box-shadow:0 2px 0 rgba(0,0,0,.12);}
.secbar .lbl{font-weight:700;font-size:.85rem;color:var(--ink-soft);margin-right:.15rem;}
.secbar button{border:2px solid var(--line);background:transparent;border-radius:.55rem;padding:.2rem .6rem;font-weight:700;
  min-width:2.3rem;min-height:2.4rem;font-family:var(--display);}
.secbar button.all{font-family:var(--body);min-width:auto;}
.secbar button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink);}
.tag.cut{background:#F6C6BF;}
.tag.plaque{background:var(--ink);color:var(--panel);border-color:var(--ink);font-size:1rem;border-style:solid;}
.tag.plaque .n{background:rgba(255,255,255,.22);}
.tag.plaque::before{background:var(--panel);border-color:var(--panel);}
.list .mini.cut{background:#F6C6BF;}
.per{display:inline-block;font-size:.78rem;font-weight:700;color:var(--ink);border-radius:999px;padding:.05rem .55rem;border:3px solid;}
.ep{display:grid;gap:.5rem;margin:.4rem 0 0;padding:0;list-style:none;}
.ep li{border:2px solid var(--line);border-radius:.6rem;overflow:hidden;}
.ep .hd{width:100%;text-align:left;background:transparent;border:0;padding:.5rem .65rem;display:flex;flex-wrap:wrap;
  align-items:center;gap:.45rem;min-height:2.75rem;font-weight:700;}
.ep .bd{padding:0 .65rem .6rem;}
.ep .bd p{margin:.25rem 0;}
.ep .when{font-size:.85rem;color:var(--ink-soft);font-weight:700;}
.ep li.sel{border-color:var(--ink);}
.dock{position:absolute;left:.75rem;bottom:.75rem;display:flex;flex-wrap:wrap;gap:.4rem;max-width:calc(100% - 1.5rem);}
.dock button{display:inline-flex;align-items:center;gap:.35rem;background:var(--panel);border:2px solid var(--line);border-radius:.7rem;
  padding:.35rem .7rem;font-weight:700;font-size:.9rem;min-height:2.6rem;box-shadow:0 2px 0 rgba(0,0,0,.12);}
.dock button:hover{border-color:var(--ink-soft);}
.dock svg{width:1.2rem;height:1.2rem;flex:none;}
.legend{position:absolute;right:.75rem;top:.75rem;background:var(--panel);border:2px solid var(--line);border-radius:.8rem;
  padding:.5rem .75rem;font-size:.85rem;display:grid;gap:.3rem;max-width:15rem;}
.legend .row{display:flex;align-items:center;gap:.5rem;}
.sw-tag{width:1.6rem;height:.95rem;border-radius:.2rem .5rem .5rem .2rem;border:2px solid rgba(58,42,0,.55);background:var(--tag);flex:none;}
.sw-idea{background:var(--idea-soft);border:2px dashed var(--idea);}
.sw-today{background:var(--today);border-color:#7d8b93;}
.sw-cut{background:#F6C6BF;border-color:#a8564a;}
.nogl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:2rem;text-align:center;}
.nogl[hidden]{display:none;}

/* Panel */
.panel{grid-area:panel;overflow-y:auto;background:var(--panel);border-left:1px solid var(--line);}
.pin{padding:1.1rem 1.2rem 1.6rem;max-width:62ch;}
.pin h2{font-family:var(--display);font-weight:600;font-size:1.45rem;line-height:1.2;margin:.2rem 0 .6rem;}
.pin h3{font-family:var(--display);font-weight:600;font-size:1.1rem;margin:1.3rem 0 .45rem;}
.pin p{margin:.3rem 0 .6rem;}
.pin .soft{color:var(--ink-soft);font-size:.9rem;}
.pin ul.how{padding-left:1.2rem;margin:.2rem 0;}
.pin ul.how li{margin:.15rem 0;}
.key{display:grid;gap:.5rem;}
.key div{padding:.45rem .7rem;border-radius:.5rem;}
.key b{display:block;}
.blk{margin:.8rem 0;padding:.65rem .85rem;border-radius:.6rem;background:var(--chip);}
.blk h3{margin:0 0 .25rem;display:flex;align-items:center;gap:.45rem;font-size:1.05rem;}
.blk h3 svg{width:1.3rem;height:1.3rem;flex:none;}
.blk p{margin:0;}
.blk.see{border-left:7px solid var(--tag);}
.blk.think{border-left:7px solid var(--earth);}
.blk.idea{background:var(--idea-soft);border:2px dashed var(--idea);}
.blk.note{background:transparent;border:2px solid var(--line);}
.conf{display:flex;align-items:center;gap:.6rem;margin:.9rem 0 .4rem;font-weight:700;}
.dots{display:inline-flex;gap:.25rem;}
.dots i{width:.9rem;height:.9rem;border-radius:50%;border:2px solid var(--ink);display:block;}
.dots i.on{background:var(--ink);}
.list{display:grid;gap:.4rem;margin:.3rem 0 0;padding:0;list-style:none;}
.list button{width:100%;text-align:left;display:flex;align-items:center;gap:.6rem;background:transparent;border:2px solid var(--line);
  border-radius:.6rem;padding:.45rem .6rem;min-height:2.75rem;}
.list button:hover{border-color:var(--ink-soft);}
.list .mini{flex:none;min-width:2.2rem;height:1.6rem;padding:0 .3rem;border-radius:.2rem .6rem .6rem .2rem;background:var(--tag);color:var(--tag-ink);
  font-family:var(--display);font-weight:600;display:inline-flex;align-items:center;justify-content:center;border:2px solid rgba(58,42,0,.5);}
.list .mini.today{background:var(--today);border-color:#7d8b93;color:#243038;}
.list .mini.zone{background:#fff6d6;border-style:dashed;}
.list .mini.strata{background:#F3D9B8;}
.list .sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);}
.sw-layer{flex:none;width:1.6rem;height:1.6rem;border-radius:.3rem;border:2px solid rgba(0,0,0,.35);}
.actions{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem;}
.btn{border:2px solid var(--ink);background:var(--panel);border-radius:.6rem;padding:.45rem .9rem;font-weight:700;min-height:2.6rem;}
.btn.primary{background:var(--ink);color:var(--panel);}
.btn.idea{border:2px dashed var(--idea);background:var(--idea-soft);color:var(--ink);}
.back{border:0;background:transparent;padding:.2rem 0;font-weight:700;color:var(--ink-soft);display:inline-flex;align-items:center;gap:.3rem;min-height:2.4rem;}
.kicker{display:inline-flex;align-items:center;gap:.4rem;font-weight:700;color:var(--ink-soft);font-size:.9rem;}
.dig{margin-top:.8rem;padding:.7rem .85rem;border:2px solid var(--line);border-radius:.6rem;}
.dig .step{font-weight:700;font-size:.9rem;color:var(--ink-soft);}
.credit{margin-top:1.6rem;padding-top:.8rem;border-top:1px solid var(--line);font-size:.82rem;color:var(--ink-soft);}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

/* Ampliación: pestañas, tiempo, cuaderno, retos y medida */
.tabs{display:flex;gap:.15rem;padding:.45rem .7rem 0;border-bottom:2px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:3;overflow-x:auto;}
.tabs button{border:0;background:transparent;font-size:.92rem;padding:.5rem .45rem;flex:none;font-weight:700;min-height:2.6rem;color:var(--ink-soft);border-bottom:4px solid transparent;margin-bottom:-2px;white-space:nowrap;}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);}
.dock button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink);}
.labels.hide{display:none;}
.time-mode .legend,.time-mode .secbar{display:none;}
.time-mode .toast{top:5.6rem;}
.caption{position:absolute;left:.75rem;top:.75rem;background:var(--panel);border:2px solid var(--line);border-radius:.8rem;padding:.45rem .75rem;max-width:min(24rem,calc(100% - 1.5rem));display:grid;gap:.25rem;}
.caption[hidden],.toast[hidden],.mlabel[hidden]{display:none;}
.caption b{font-family:var(--display);font-weight:600;font-size:1.1rem;}
.kind-chip{display:inline-block;justify-self:start;font-size:.82rem;font-weight:700;padding:.08rem .6rem;border-radius:999px;border:2px solid var(--line);background:var(--chip);}
.kind-chip.idea{border-style:dashed;border-color:var(--idea);background:var(--idea-soft);}
.kind-chip.now,.kind-chip.dig{border-color:var(--tag);background:#fff4cc;color:#3a2a00;}
.toast{position:absolute;left:.75rem;top:.75rem;max-width:min(22rem,60%) !important;background:var(--ink);color:var(--panel);border-radius:.7rem;padding:.45rem .8rem;font-weight:700;font-size:.9rem;max-width:calc(100% - 1.5rem);text-align:center;}
.mlabel{position:absolute;left:0;top:0;background:#d92d20;color:#fff;font-weight:700;border-radius:.5rem;padding:.15rem .55rem;pointer-events:none;box-shadow:0 2px 0 rgba(0,0,0,.25);}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .45s ease-out;}
.flash.on{opacity:.85;transition:none;}
.tl-now{margin:.6rem 0;padding:.7rem .85rem;border:2px solid var(--line);border-radius:.6rem;}
.tl-now h3{margin:.1rem 0 .4rem;}
.tl-now p{margin:.5rem 0 0;}
.step{font-weight:700;font-size:.9rem;color:var(--ink-soft);}
.list .grow{flex:1;}
.list .state{font-size:.85rem;font-weight:700;color:var(--ink-soft);white-space:nowrap;}
.list .reto{align-items:flex-start;}
.progress{height:.75rem;background:var(--chip);border-radius:999px;overflow:hidden;border:1px solid var(--line);}
.progress i{display:block;height:100%;background:var(--tag);}
.opts{display:flex;flex-wrap:wrap;gap:.4rem;border:0;padding:0;margin:.5rem 0 1rem;min-width:0;}
.opts legend{font-weight:700;margin-bottom:.4rem;padding:0;}
.opt{position:relative;display:inline-flex;}
.opt input{position:absolute;opacity:0;width:1px;height:1px;}
.opt span{display:inline-flex;align-items:center;border:2px solid var(--line);border-radius:999px;padding:.25rem .8rem;min-height:2.5rem;cursor:pointer;}
.opt input:checked+span{border-color:var(--ink);background:var(--ink);color:var(--panel);}
.opt input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px;}
.fld{display:block;font-weight:700;margin:.2rem 0 .35rem;}
textarea{width:100%;font:inherit;border:2px solid var(--line);border-radius:.6rem;padding:.5rem .6rem;background:var(--panel);color:var(--ink);resize:vertical;}
.fb{margin:.6rem 0;padding:.55rem .8rem;border-radius:.6rem;border:2px solid var(--line);}
.fb.ok{border-color:#2e7d4f;background:rgba(46,125,79,.08);}
.fb.no{border-color:#b3541e;background:rgba(179,84,30,.08);}
.stmt{font-size:1.15rem;font-weight:700;margin:.7rem 0;padding:.75rem .9rem;border-radius:.6rem;background:var(--chip);}
.sayb{display:inline-flex;align-items:center;gap:.4rem;}
.sayb svg{width:1.25rem;height:1.25rem;}
.sayb.see{border-left:7px solid var(--tag);}
.sayb.think{border-left:7px solid var(--earth);}
.btn[disabled]{opacity:.45;cursor:not-allowed;}
.order{list-style:none;padding:0;margin:.3rem 0;display:grid;gap:.35rem;}
.order li{display:flex;align-items:center;gap:.45rem;border:2px solid var(--line);border-radius:.6rem;padding:.3rem .45rem;flex-wrap:wrap;}
.order li.good{border-color:#2e7d4f;}
.order li.bad{border-color:#b3541e;border-style:dashed;}
.order .nm{flex:1;text-align:left;border:0;background:transparent;font-weight:700;padding:.3rem .2rem;min-height:2.4rem;}
.order .mark{font-size:.82rem;font-weight:700;}
.order .ic{width:2.5rem;height:2.5rem;border:2px solid var(--line);border-radius:.5rem;background:var(--panel);}
.order .ic[disabled]{opacity:.35;cursor:default;}
.chk{display:flex;align-items:center;gap:.55rem;width:100%;text-align:left;border:2px solid var(--line);background:transparent;border-radius:.6rem;padding:.4rem .6rem;min-height:2.6rem;margin:.35rem 0;}
.chk .box{width:1.25rem;height:1.25rem;border:2px solid var(--ink);border-radius:.25rem;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:700;}

<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <h1 data-i18n="title">Excavamos una casa griega</h1>
      <p data-i18n="subtitle">Una maqueta para descubrir cómo trabajan los arqueólogos</p>
    </div>
    <div class="top-actions">
      <div class="lang" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="es" aria-pressed="true" lang="es">ES</button>
        <button type="button" data-lang="en" aria-pressed="false" lang="en">EN</button>
      </div>
      <button type="button" id="ideasBtn" class="ideas-btn" aria-pressed="false">
        <span class="sw" aria-hidden="true"></span><span class="long" data-i18n="ideasBtn">Ideas de cómo pudo ser</span><span class="short" aria-hidden="true" data-i18n="ideasShort">Ideas</span>
      </button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="c" tabindex="0"></canvas>
    <div class="labels" id="labels"></div>
    <div class="conj" id="conj" hidden></div>

      <button type="button" data-sec="B" aria-pressed="false">B</button>
      <button type="button" data-sec="C" aria-pressed="false">C</button>
      <button type="button" data-sec="ALL" aria-pressed="false" class="all" data-i18n="secAll">Plano</button>
    </div>

    <div class="legend" aria-hidden="false">
      <div class="row"><span class="sw-tag"></span><span data-i18n="legFound">Lo hemos encontrado</span></div>
      <div class="row"><span class="sw-tag sw-idea"></span><span data-i18n="legIdea">Idea: cómo pudo ser</span></div>

      <button type="button" data-act="in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21M10.5 7.5v6M7.5 10.5h6"/></svg><span class="txt" data-i18n="zIn">Acercar</span></button>
      <button type="button" data-act="out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21M7.5 10.5h6"/></svg><span class="txt" data-i18n="zOut">Alejar</span></button>
      <button type="button" data-act="top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M4 12h8V4"/></svg><span class="txt" data-i18n="plan">Desde arriba</span></button>
      <button type="button" data-act="measure" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="8" width="19" height="8" rx="1.5"/><path d="M6.5 8v3M10 8v4M13.5 8v3M17 8v4"/></svg><span class="txt" data-i18n="measureBtn">Medir</span></button>

    <div class="caption" id="caption" hidden></div>
    <div class="strat" id="strat" role="img" hidden></div>
    <div class="tline" id="tline" hidden>
      <button type="button" class="tplay" id="tlPlay"></button>
      <div class="ttrack">
        <div class="tsegs" aria-hidden="true"><span class="s1" id="tlSeg1"></span><span class="s2" id="tlSeg2"></span></div>
        <input type="range" id="tlRange" min="0" max="7" step="0.01" value="7">
        <div class="tticks" aria-hidden="true"><i>1</i><i>2</i><i>3</i><i>4</i><i>5</i><i>6</i><i>7</i><i>8</i></div>
      </div>
    </div>
    <div class="mlabel" id="mlabel" hidden role="status"></div>
    <div class="toast" id="toast" hidden role="status"></div>
    <div class="flash" id="flash" aria-hidden="true"></div>
    <div class="nogl" id="nogl" hidden><p data-i18n="noGL">Tu navegador no puede mostrar la maqueta en 3D. Puedes leer todas las fichas en la lista.</p></div>
  </main>

  <aside class="panel" id="panel" aria-labelledby="panelTitle">
    <div class="tabs" role="tablist" id="tabs" aria-label="Secciones">
      <button type="button" role="tab" id="tab-explorar" data-tab="explorar" aria-selected="true" aria-controls="panelInner">Explorar</button>
      <button type="button" role="tab" id="tab-tiempo" data-tab="tiempo" aria-selected="false" aria-controls="panelInner" tabindex="-1">Tiempo</button>
      <button type="button" role="tab" id="tab-cuaderno" data-tab="cuaderno" aria-selected="false" aria-controls="panelInner" tabindex="-1">Cuaderno</button>
      <button type="button" role="tab" id="tab-epocas" data-tab="epocas" aria-selected="false" aria-controls="panelInner" tabindex="-1">Épocas</button>
      <button type="button" role="tab" id="tab-conjunto" data-tab="conjunto" aria-selected="false" aria-controls="panelInner" tabindex="-1">Conjunto</button>
      <button type="button" role="tab" id="tab-retos" data-tab="retos" aria-selected="false" aria-controls="panelInner" tabindex="-1">Retos</button>
    </div>
    <div class="pin" id="panelInner" role="tabpanel" aria-live="polite"></div>
  </aside>
</div>

   "digSteps": [
    "Soil from the collapse layer is still here. When a layer is thick, it is sometimes removed in slices of about 15 cm to note at what height each thing appears. Nobody knows what is underneath.",
    "You removed one slice. There is only soil and tiny bits of clay. We write it down: no new finds. That is information too!",
    "A small piece of roof tile appears. We measure it, take a photo and keep it in a bag with its label.",
    "You reached the floor of the house. There are no more objects here. Everything is drawn and the team moves to another area."
   ],
   "strataIntro": "Layers of soil are like a pile of sheets of paper: usually, what is lower down is older than what is on top. But there are exceptions: if someone dug a pit, things can get mixed up. Tap a layer on the wall of the model or in this list.",
   "layersH": "From top to bottom",
   "finds": {
    "cimientos": {
     "name": "Stone foundations",
     "see": "Rows of stones set in a line. They make a corner and leave a gap. In one stretch, stones are missing.",
     "think": "They are the bottom part of the walls of a house. The gap may have been a door. Someone may have taken the missing stones to build something else.",
     "idea": "On top of the stones there were mud-brick walls: bricks of mud and straw dried in the sun. We did not find them because mud brick survives badly: once the roof falls in and rain soaks it, it melts away. The height you see (about 2 metres) is a guess: some houses of this type had an upper floor and were taller."
    },
    "hogar": {
     "name": "Hearth",
     "see": "A black patch of ash and charcoal with stones around it. The soil around it is reddish, as if burnt.",
     "think": "A fire was lit here. Maybe it was used for cooking or for keeping warm."
    },
    "anfora": {
     "name": "Pieces of an amphora",
     "see": "Six pieces of orange fired clay, thick and curved. One has a handle and another ends in a point.",
     "think": "If we join them like a puzzle, they make a large jar with two handles: an amphora. It was used to store or carry oil, wine or other food. We don’t know what this one held; a laboratory could look for traces in the clay.",
     "idea": "This is how a whole amphora may have looked. It is a rough drawing of a typical shape: with six pieces the exact profile cannot be known. To find out, archaeologists compare the pieces with complete amphorae in museums.",
     "note": "It is not treasure: it was an everyday container, like a big plastic bottle today."
    },
    "copa": {
     "name": "Piece of a black cup",
     "see": "A small, thin piece. It is black and shiny, outside and inside.",
     "think": "It seems to be part of a drinking cup. This shiny black gloss (a very thin layer of fired clay) was typical of Greek tableware. It helps us know how old the house is.",
     "idea": "A wide, low cup with two handles and a foot. This is a suggestion: with only one piece, other shapes are possible.",
     "note": "It is valuable for learning, even if it is not worth money."
    },
    "olla": {
     "name": "Pieces of a cooking pot",
     "see": "Pieces of dark, rough clay with black patches of soot. They are near the hearth.",
     "think": "It may have been a cooking pot. Soot usually appears when a pot is put on the fire.",
     "idea": "A pot on the fire of the hearth. This shape is likely, but not certain."
    },
    "tejas": {
     "name": "Broken roof tiles",
     "see": "Large, flat pieces of fired clay, broken. They are on the floor and inside the reddish layer of the wall.",
     "think": "They were roof tiles. When the house was abandoned, the roof fell in and the tiles came down."
    },
    "pesas": {
     "name": "Loom weights",
     "see": "Two pieces of fired clay shaped like pyramids. Each one has a hole at the top.",
     "think": "They hung from the threads of a loom to keep them tight. Maybe someone wove here… or only kept them here. With two pieces we cannot tell.",
     "idea": "An upright loom leaning on the wall, with the weights hanging. It is only a possibility."
    },
    "huesos": {
     "name": "Possible food leftovers",
     "see": "A small broken bone and four olive stones.",
     "think": "They may be leftovers from meals. If there are many, of several kinds, they help us know what was eaten. Olive stones may also have been used as fuel for the fire. A specialist tries to tell which animal the bone came from; with a small piece, often they can only say “sheep or goat”.",
     "note": "For archaeologists, old rubbish is a very important clue."
    },
    "capas": {
     "name": "Layers of soil"
    },
    "porExcavar": {
     "name": "Area still to dig",
     "see": "A square marked with pegs and strings. The soil has not been touched.",
     "think": "We don’t know yet. Archaeologists dig slowly, layer by layer, and draw and photograph everything before going on. Often nothing special appears, and that is information too."
    },
    "herramientas": {
     "name": "Today’s tools",
     "see": "A black rubber bucket, a trowel and a black and white scale bar.",
     "think": "They belong to the archaeologists, not to the Greek house. The trowel scrapes the soil little by little; the bucket carries soil away; the scale shows the real size in photos."
    },
    "b_muro": {
     "name": "Roman wall",
     "see": "Two faces of small stones with a hard grey mass between them. Along one stretch there are three much larger blocks of a different colour.",
     "think": "It is a wall built with mortar, a Roman technique. The large blocks look like the kind of stone in the Greek house: they were probably reused.",
     "idea": "This is how the complete wall may have looked. Only the lower part survives."
    },
    "b_trinchera": {
     "name": "Robber trench",
     "see": "A long, narrow band of different soil with loose rubble, slightly sunken below the floor. In the front section you can see it cuts through the mortar floor, the fill and the Greek level, and that it is full of stones.",
     "think": "There was a wall here that is gone: someone took the stones to reuse them. The gap is left, filled in later. Archaeologists call it a robber trench or “ghost wall”: the plan of the building can be drawn even though the stones are missing. The Roman collapse lying above it covers it: that is why the trench is later than the floor and earlier than the collapse.",
     "idea": "This is how the missing wall may have looked, drawn by following the shape of the trench.",
     "note": "Because the trench cuts other layers, it is later than they are. Cutting is a clue about order."
    },
    "b_sigillata": {
     "name": "Terra sigillata",
     "see": "Pieces of red clay with a smooth, shiny surface. One is a base with letters pressed into it.",
     "think": "It is fine Roman tableware. The letters are the stamp of a potter or a workshop. As these vessels were made within known dates, they help date the layer.",
     "note": "It was made in huge quantities: everyday tableware, not a luxury object."
    },
    "b_tegula": {
     "name": "Roman roof tiles",
     "see": "Flat pieces with a raised edge along the sides, and a curved piece like half a pipe.",
     "think": "They are two parts that worked together: the flat one (tegula) and the curved one (imbrex), which covered the joint. It is a different way of roofing from the tiles of the Greek house."
    },
    "b_moneda": {
     "name": "Bronze coin",
     "see": "A small greenish metal disc, very worn. The design is barely visible.",
     "think": "If it is cleaned carefully, we may read which emperor it belongs to. Then we know the layer did not form before that date. Careful: coins were used for many years, so the layer can be a good deal later.",
     "note": "It is not worth much money. It is worth a lot for dating."
    },
    "b_hoyo": {
     "name": "Modern pit",
     "see": "A round hole cutting through several layers. Inside, disturbed soil and a piece of blue plastic.",
     "think": "Someone made it recently, maybe to plant a tree. This matters: in this pit there are new things below old layers. The rule about layers fails when something cuts the ground.",
     "note": "That is why archaeologists draw the edges of every pit or trench."
    },
    "b_sondeo": {
     "name": "Sounding below the Roman floor",
     "see": "A small square hole opened in the mortar floor. At the bottom there is darker soil and a shiny black piece.",
     "think": "A small window has been dug to see what lies below without destroying the Roman floor. Underneath comes the Greek level: the same period as Area A.",

    "b_capas": {

/* Valida el archivo de datos y devuelve una lista de problemas legibles */
function validarYacimiento(){
  var e=[], idiomas=Object.keys(TXT);
  function hay(id){ return !!LAYER_CATA[id]; }
  Object.keys(FINDS).forEach(function(id){
    var f=FINDS[id];
    if(!YAC.catas[f.sec]) e.push('hallazgo «'+id+'»: la cata «'+f.sec+'» no existe');
    idiomas.forEach(function(l){ if(!TXT[l].finds||!TXT[l].finds[id]) e.push('hallazgo «'+id+'»: falta su texto en «'+l+'»'); });
  });
  CATAS.forEach(function(k){
    var c=YAC.catas[k];
    c.orden.forEach(function(id){ if(!FINDS[id]) e.push('cata '+k+': el orden cita «'+id+'», que no existe'); });
    if(!FINDS[c.fichaCapas]) e.push('cata '+k+': la ficha de capas «'+c.fichaCapas+'» no existe');
    c.estratos.capas.forEach(function(L){
      if(!LPH[L.id]) e.push('capa «'+L.id+'»: no tiene época asignada');
      idiomas.forEach(function(l){ if(!TXT[l].layers||!TXT[l].layers[L.id]) e.push('capa «'+L.id+'»: falta su texto en «'+l+'»'); });
    });
  });
  YAC.objetos.forEach(function(o,i){
    if(!MODELOS[o.modelo]) e.push('objeto '+(i+1)+': el modelo «'+o.modelo+'» no existe en el catálogo');
    if(o.id && !FINDS[o.id]) e.push('objeto '+(i+1)+': el hallazgo «'+o.id+'» no existe');
    if(!YAC.catas[o.cata]) e.push('objeto '+(i+1)+': la cata «'+o.cata+'» no existe');
  });
  CORR.forEach(function(r,i){
    r[1].concat(r[3]).forEach(function(id){ if(!hay(id)) e.push('correlación '+(i+1)+': la capa «'+id+'» no existe'); });
    if(PKEY.indexOf(r[5])<0) e.push('correlación '+(i+1)+': la época «'+r[5]+'» no existe');
  });
  Object.keys(LPH).forEach(function(id){ if(!hay(id)) e.push('cronología: la capa «'+id+'» no existe'); });
  EPOCA_Q.forEach(function(q){ if(!FINDS[q.f]) e.push('reto de épocas: el hallazgo «'+q.f+'» no existe'); if(PKEY.indexOf(q.k)<0) e.push('reto de épocas: la época «'+q.k+'» no existe'); });
  CORR_Q.forEach(function(q){ if(!q.custom && !hay(q.id)) e.push('reto de correlación: la capa «'+q.id+'» no existe'); });
  Object.keys(NB_KEY).forEach(function(id){ if(!FINDS[id]) e.push('cuaderno: el hallazgo «'+id+'» no existe'); });
  ORDER_OK.forEach(function(id){ if(!hay(id)) e.push('reto de orden: la capa «'+id+'» no existe'); });
  MISSIONS_OK.forEach(function(m,i){ m.ok.forEach(function(id){ if(!FINDS[id]) e.push('misión '+(i+1)+': el hallazgo «'+id+'» no existe'); }); });
  Object.keys(FWIN).forEach(function(id){ if(!hay(id)) e.push('secuencia: la capa «'+id+'» no existe'); });
  idiomas.forEach(function(l){ if(TXT[l].time.stages.length!==TIME_K.length) e.push('secuencia: «'+l+'» tiene '+TXT[l].time.stages.length+' momentos y hay '+TIME_K.length+' tipos'); });
  return e;
}

var tmpV=null;
var sizesDirty=true;
function measureLabels(){ ORDER.forEach(function(id){ var el=tagEls[id]; el._w=el.offsetWidth; el._h=el.offsetHeight; }); Object.keys(plaqueEls).forEach(function(k){ var e=plaqueEls[k]; e._w=e.offsetWidth; e._h=e.offsetHeight; }); sizesDirty=false; }
/* Coloca las etiquetas y evita que se tapen: las más cercanas se quedan en su sitio
   y las demás suben, alargando su línea guía. */
function placeLabels(w,h){
  if(timeStage!==TLIVE) return;
  if(sizesDirty) measureLabels();
  var items=[];
  ORDER.forEach(function(id){
    var el=tagEls[id], ff=FINDS[id];
    if(state.site || ff.sec!==state.sec){ el.classList.add('off'); return; }
    tmpV.copy(wv(ff.anchor,ff.sec)).project(camera);
    if(tmpV.z>1||tmpV.x<-1.3||tmpV.x>1.3||tmpV.y<-1.2||tmpV.y>1.4){ el.classList.add('off'); return; }
    el.classList.remove('off');
    items.push({el:el,x:(tmpV.x*.5+.5)*w,y:(-tmpV.y*.5+.5)*h,z:tmpV.z});
  });
  ['A','B','C'].forEach(function(k){
    var el=plaqueEls[k]; if(!el) return;
    if(!state.site){ el.classList.add('off'); return; }
    el.classList.remove('off');
    tmpV.copy(wv([-0.6,3.4,-0.6],k)).project(camera);
    if(tmpV.z>1){ el.classList.add('off'); return; }
    items.push({el:el,x:(tmpV.x*.5+.5)*w,y:(-tmpV.y*.5+.5)*h,z:tmpV.z});
  });
  items.sort(function(a,b){ return a.z-b.z; });
  var placed=[], pad=4;
  items.forEach(function(it){
    var ew=it.el._w||120, eh=it.el._h||28, lead=16;
    var left=Math.max(4,Math.min(w-ew-4,it.x-ew/2)), top=it.y-lead-eh;
    for(var guard=0;guard<14;guard++){
      var hit=null;
      for(var i=0;i<placed.length;i++){ var r=placed[i]; if(left<r.r+pad&&left+ew>r.l-pad&&top<r.b+pad&&top+eh>r.t-pad){ hit=r; break; } }
      if(!hit) break;
      top=hit.t-eh-pad; lead=it.y-top-eh;
      if(lead>180) break;
    }
    top=Math.max(4,top); lead=Math.max(8,it.y-top-eh);
    placed.push({l:left,r:left+ew,t:top,b:top+eh});
    it.el.style.transform='translate('+left.toFixed(1)+'px,'+top.toFixed(1)+'px)';
    it.el.style.setProperty('--lead',lead.toFixed(0)+'px');
    it.el.style.setProperty('--lx',Math.max(10,Math.min(ew-10,it.x-left)).toFixed(0)+'px');
    it.el.style.zIndex=String(1000-placed.length);
  });
}

function lyLabel(id){ var t=T(), r=LPH[id]; return t.layers[id].name+', '+t.conj.hdr[layCol(id)]+', '+(r[0]===r[1]?phaseName(r[0]):phaseName(r[0])+' – '+phaseName(r[1])); }

function layerGroup(L,x,y,w,h,k,left){
  var t=T(), id=L.id, sel=conj.sel===id, rel=relSet()[id], r=LPH[id];

function drawCortes(t){
  var c=t.conj, K=112, TOP=68, CW=150, X={C:90,A:284,B:478}, ph=conj.phase, s='', vis={}, body='', selG='';
  function Y(v){ return TOP+(2.8-v)*K; }
  CCOLS.forEach(function(k){
    var cx=X[k]+CW/2;
    s+='<text x="'+cx+'" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink)">'+esc(c.hdr[k])+'</text>'
      +'<text x="'+cx+'" y="47" text-anchor="middle" font-size="13" fill="var(--ink-soft)">'+esc(c.sub[k])+'</text>';
  });
  s+='<line x1="62" y1="'+Y(1)+'" x2="62" y2="'+Y(0)+'" stroke="var(--ink)" stroke-width="2"/><line x1="56" y1="'+Y(1)+'" x2="68" y2="'+Y(1)+'" stroke="var(--ink)" stroke-width="2"/><line x1="56" y1="'+Y(0)+'" x2="68" y2="'+Y(0)+'" stroke="var(--ink)" stroke-width="2"/>'
    +'<text x="62" y="'+(Y(1)-7)+'" text-anchor="middle" font-size="12" fill="var(--ink-soft)">'+esc(c.scale)+'</text>';

    function span(list){ var a=null,b=null; list.forEach(function(id){ if(vis[id]){ a=(a===null)?vis[id][0]:Math.min(a,vis[id][0]); b=(b===null)?vis[id][1]:Math.max(b,vis[id][1]); } }); return a===null?null:[a,b]; }

    var xa=X[e[0]]+CW, xb=X[e[2]], hot=conj.sel&&(e[1].indexOf(conj.sel)>=0||e[3].indexOf(conj.sel)>=0);
    rib+='<polygon aria-hidden="true" points="'+xa+','+A[0].toFixed(1)+' '+xb+','+B[0].toFixed(1)+' '+xb+','+B[1].toFixed(1)+' '+xa+','+A[1].toFixed(1)+'" fill="'+PCOL[e[5]]+'" fill-opacity="'+(hot?.75:.42)+'" stroke="'+PCOL[e[5]]+'" stroke-width="'+(hot?2.5:1.2)+'"'+(e[4]==='hip'?' stroke-dasharray="6 4"':'')+'/>';
  });

  var idx=2-digStep, sl=digSlices[idx], base=.14+idx*.28;
  digStep++; digChecks.photo=false; digChecks.draw=false;
  if(hasGL){
    if(RM){ sl.visible=false; afterDig(); }
    else { var t0=performance.now(); (function shrink(){ var k=Math.min(1,(performance.now()-t0)/450); sl.scale.y=Math.max(.001,1-k); sl.position.y=base-.14*k; if(k<1) requestAnimationFrame(shrink); else { sl.visible=false; afterDig(); } })(); }
  } else afterDig();
  render(false);

var TLIVE=TXT.es.time.stages.length-1;

  ['derrumbe','acumulada','vegetal'].forEach(function(l){
    var f=fills[l]; if(!f) return;
    var p=fillP(l,t), q=Math.max(.001,p);

function applyTime(st){
  timeStage=st;

  labelsEl.classList.toggle('hide',!live);
  updateCaption();
  if(!hasGL) return;
  ['derrumbe','acumulada','vegetal'].forEach(function(l,i){
    (wallParts[l]||[]).forEach(function(m){ m.visible = live || st>=2+i; });
  });
  wallTiles.forEach(function(m){ m.visible = live || st>=2; });
  if(tufts) tufts.visible = live || st>=4;
  FR.forEach(function(g){ g.visible = st!==0; });
  if(TILESF) TILESF.visible = live || st>=2;
  TOOLS.forEach(function(o){ o.visible = live || st>=5; });
  if(live) restoreZone();

  if(live){ ghosts.visible=ideasOn; ghostWalls.concat(ghostObjs).forEach(function(g){ g.visible=true; }); ghostRoof.visible=false; }
  else { ghosts.visible = st<=1; ghostWalls.forEach(function(g){ g.visible=st<=1; }); ghostObjs.forEach(function(g){ g.visible=st===0; }); ghostRoof.visible=st<=1; clearHighlight(); }
}
function stageOf(t){ return t>=TLIVE-.001 ? TLIVE : Math.min(TLIVE-1,Math.max(0,Math.round(t))); }
function setSim(t,force){
  t=Math.max(0,Math.min(TLIVE,t)); timeT=t;
  var st=stageOf(t);

  if(hasGL) applyFills(t);

function tweenSim(t1,dur,done){
  cancelSim();
  var t0=timeT, a={cancel:false}; simAnim=a;
  if(RM || !hasGL || Math.abs(t1-t0)<.001){ setSim(t1,false); simAnim=null; if(done) done(); return; }
  var st=performance.now(), total=dur*Math.max(.4,Math.abs(t1-t0));
  (function step(now){
    if(a.cancel) return;
    var k=Math.min(1,(now-st)/total), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    setSim(t0+(t1-t0)*e,false);

  })(st);
}

function drawStrat(t){
  var tt=T(), c=tt.time.col, K=72, BOT=274, X0=12, W=90, GX=126;
  var natH=.35*K, sueH=.25*K, ySue=BOT-natH-sueH, yBase=ySue;

  var s='<svg viewBox="0 0 150 302" xmlns="http://www.w3.org/2000/svg" font-family="Atkinson Hyperlegible, Verdana, sans-serif" preserveAspectRatio="xMidYMid meet" aria-hidden="true">';
  s+='<text x="75" y="15" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">'+esc(c.title)+'</text>';
  // base: terreno natural y suelo de la casa
  s+='<rect x="'+X0+'" y="'+(BOT-natH)+'" width="'+W+'" height="'+natH+'" fill="#d8cdaa" stroke="rgba(0,0,0,.45)"/>';
  s+='<text x="'+(X0+W/2)+'" y="'+(BOT-natH/2+4)+'" text-anchor="middle" font-size="10" font-weight="700" fill="#1e2b33">'+esc(tt.layers.natural.name)+'</text>';
  s+='<rect x="'+X0+'" y="'+ySue+'" width="'+W+'" height="'+sueH+'" fill="#cdb38c" stroke="rgba(0,0,0,.45)"/>';
  s+='<text x="'+(X0+W/2)+'" y="'+(ySue+sueH/2+4)+'" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1e2b33">'+esc(tt.layers.suelo.name)+'</text>';
  // referencia fija de los tres niveles (esquema punteado) y capas vivas
  var ref=[], yy=yBase;
  order.forEach(function(o){ var h=o[1]*K; ref.push({l:o[0],n:o[2],col:o[3],y:yy-h,h:h}); yy-=h; });
  var doneN=0;
  if(t>=3.5) ref.forEach(function(r){
    s+='<rect x="'+X0+'" y="'+r.y+'" width="'+W+'" height="'+r.h+'" fill="none" stroke="var(--ink-soft)" stroke-width="1.5" stroke-dasharray="4 3"/>';
  });
  var topY=yBase;

    var p=fillP(r.l,t), h=r.h*p;
    if(p>.01){
      var y=topY-h;

      if(h>=24){

      }
      topY=y;
    }
  });

    var w=FWIN[r.l], cy=r.y+r.h/2, st;

    else if(st==='active') s+='<circle cx="'+GX+'" cy="'+cy+'" r="11" fill="var(--panel)" stroke="var(--ink)" stroke-width="2"/><circle cx="'+GX+'" cy="'+cy+'" r="7" fill="none" stroke="var(--ink)" stroke-width="2"/><text x="'+GX+'" y="'+(cy+4)+'" text-anchor="middle" font-size="10" font-weight="700" fill="var(--ink)">'+r.n+'</text>';
    else s+='<circle cx="'+GX+'" cy="'+cy+'" r="10" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.5"/><text x="'+GX+'" y="'+(cy+4)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">'+r.n+'</text>';
    s+='<text x="'+GX+'" y="'+(cy+22)+'" text-anchor="middle" font-size="9" fill="var(--ink)">'+esc(c[st])+'</text></g>';
  });

  s+='</svg>';

}

var measure={on:false,pts:[],objs:[],last:null}, MMAT=null;
function toast(msg){ var el=$('#toast'); if(!msg){ el.hidden=true; return; } el.textContent=msg; el.hidden=false; }
function fmtLen(d){ var m=d*.5; if(m<1) return Math.round(m*100)+' cm'; var s=m.toFixed(1); if(LANG==='es') s=s.replace('.',','); return s+' m'; }
function clearMeasure(){
  if(hasGL) measure.objs.forEach(function(o){ scene.remove(o); if(o.geometry) o.geometry.dispose(); });
  measure.objs=[]; measure.pts=[]; $('#mlabel').hidden=true;
}
function setMeasure(on){
  if(!hasGL) return;
  measure.on=on; clearMeasure();
  var b=document.querySelector('#dock [data-act="measure"]'); if(b) b.setAttribute('aria-pressed',String(on));
  toast(on?T().measureHint:null);

}
function isShown(o){ while(o){ if(!o.visible) return false; o=o.parent; } return true; }
function measureClick(ev){
  var r=canvas.getBoundingClientRect(); ptr.set(((ev.clientX-r.left)/r.width)*2-1,-((ev.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ptr,camera);
  var hits=ray.intersectObjects(scene.children,true), p=null;
  for(var i=0;i<hits.length;i++){ var o=hits[i].object; if(!o.isMesh||o.isInstancedMesh||o.userData.ghost||o.userData.noMeasure||o===ringMesh) continue; if(!isShown(o)) continue; p=hits[i].point.clone(); break; }
  if(!p) return;
  if(measure.pts.length>=2) clearMeasure();
  if(!MMAT) MMAT=new THREE.MeshBasicMaterial({color:0xff3b30,depthTest:false});
  var dot=new THREE.Mesh(new THREE.SphereGeometry(.07,12,10),MMAT); dot.position.copy(p); dot.renderOrder=999; dot.userData.noMeasure=true; scene.add(dot); measure.objs.push(dot); measure.pts.push(p);
  if(measure.pts.length===2){
    var a=measure.pts[0], b=measure.pts[1], d=a.distanceTo(b);
    var cyl=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,Math.max(d,.001),8),MMAT);
    cyl.position.copy(a).add(b).multiplyScalar(.5); cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),b.clone().sub(a).normalize());
    cyl.renderOrder=998; cyl.userData.noMeasure=true; scene.add(cyl); measure.objs.push(cyl);
    measure.last=d; var ml=$('#mlabel'); ml.textContent=fmtLen(d); ml.hidden=false;
    if(state.tab==='retos' && ch.id==='mide') render(false);
  }
}
function placeMeasure(w,h){
  var ml=$('#mlabel'); if(ml.hidden || measure.pts.length<2) return;
  tmpV.copy(measure.pts[0]).add(measure.pts[1]).multiplyScalar(.5).project(camera);
  ml.style.transform='translate('+((tmpV.x*.5+.5)*w).toFixed(1)+'px,'+((-tmpV.y*.5+.5)*h).toFixed(1)+'px) translate(-50%,-150%)';
}

function setTab(tab,focus){
  if(state.tab==='conjunto'&&tab!=='conjunto') stopConjPlay();
  if(tab==='conjunto'&&measure.on) setMeasure(false);
  if(state.tab===tab && !focus){ render(false); return; }
  if(state.tab==='tiempo' && tab!=='tiempo'){ state.tab=tab; endSim(); }
  state.tab=tab;
  if(tab==='tiempo'){ if(measure.on) setMeasure(false); state.site=false; state.sec='A'; applySector(); setSim(0,true); if(hasGL) flyHome(); }

  else if(d.chback){ if(ch.id==='mide'&&measure.on) setMeasure(false); ch={id:null}; clearHighlight(); render(true); }

  else if(d.eq){ var qq=EPOCA_Q[ch.items[ch.i]]; ch.ans=d.eq; if(d.eq===qq.k) ch.score++; if(ch.i+1>=EPOCA_Q.length) chRes.epoca={a:ch.score,b:EPOCA_Q.length}; render(false); var fe=$('#chfb'); if(fe) fe.focus({preventScroll:true}); }
  else if(d.cq){ var q2=CORR_Q[ch.items[ch.i]]; ch.ans=d.cq; var ok2=q2.ans.indexOf(d.cq)>=0; if(ok2&&!ch.missed) ch.score++; if(!ok2) ch.missed=true; if(q2.ci!==undefined) conj.reveal[q2.ci]=true; if(ch.i+1>=CORR_Q.length) chRes.corr={a:ch.score,b:CORR_Q.length}; render(false); var fc=$('#chfb'); if(fc) fc.focus({preventScroll:true}); }
  else if(d.cqnext){ ch.i++; ch.ans=null; ch.missed=false; corrFocus(); render(false); refocus('[data-cq]'); }
  else if(d.eqnext){ ch.i++; ch.ans=null; render(false); refocus('[data-eq]'); }
  else if(d.vretry){ ch.ans=null; render(false); refocus('[data-vs="s"]'); }
  else if(d.vnext){ ch.i++; ch.ans=null; ch.missed=false; if(ch.i>=10) chRes.vemos={a:ch.score,b:10}; render(false); var fv=$('#chfb'); if(fv) fv.focus({preventScroll:true}); else refocus('[data-vs="s"]'); }
  else if(d.ordmove){ var pr=d.ordmove.split(':'), i=+pr[0], dir=+pr[1], j=i+dir; if(j>=0&&j<ch.order.length){ var x=ch.order[i]; ch.order[i]=ch.order[j]; ch.order[j]=x; ch.checked=false; render(false); refocus('[data-ordmove="'+j+':'+dir+'"]') ; if(document.activeElement===document.body) refocus('[data-ordmove="'+j+':'+(-dir)+'"]'); } }
  else if(d.ordlayer){ highlightLayer(d.ordlayer); }
  else if(d.ordcheck){ ch.checked=true; if(ch.order.join()===ORDER_OK.join()) chRes.orden={done:true}; render(false); var fo=$('#chfb'); if(fo) fo.focus({preventScroll:true}); }
  else if(d.mskip){ ch.missed=true; nextMission(); }
  else if(d.mnext) nextMission();
  else if(d.mideon){ setMeasure(!measure.on); refocus('[data-mideon]'); }
  else if(d.mide!==undefined){ ch.ans=+d.mide; if(ch.ans===1) chRes.mide={done:true}; render(false); var f4=$('#chfb'); if(f4) f4.focus({preventScroll:true}); }
});
document.addEventListener('keydown',function(e){ if(e.key==='Escape' && measure.on) setMeasure(false); });
canvas.addEventListener('keydown',function(e){
  if(!hasGL) return;
  var k=e.key, used=true;
  if(k==='ArrowLeft') orbitBy(-.2,0,1,200); else if(k==='ArrowRight') orbitBy(.2,0,1,200);
  else if(k==='ArrowUp') orbitBy(0,-.12,1,200); else if(k==='ArrowDown') orbitBy(0,.12,1,200);
  else if(k==='+'||k==='=') orbitBy(0,0,.85,200); else if(k==='-'||k==='_') orbitBy(0,0,1.18,200);
  else used=false;
  if(used) e.preventDefault();
});

/* Selección con puntero: distingue clic de arrastre */
var ray=null, ptr=null, down=null, hoverId=null;
function pick(ev){
  if(timeStage!==TLIVE) return null;
  var r=canvas.getBoundingClientRect(); ptr.set(((ev.clientX-r.left)/r.width)*2-1,-((ev.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ptr,camera);
  var hits=ray.intersectObjects(pickables,false);
  for(var i=0;i<hits.length;i++){ var o=hits[i].object; if(!isShown(o)) continue; if(o.userData.ghost && !ideasOn) continue; if(o.userData.findId) return o; }
  return null;
}
canvas.addEventListener('pointerdown',function(e){ down={x:e.clientX,y:e.clientY}; if(anim) anim=null; });
canvas.addEventListener('pointerup',function(e){
  if(!hasGL||!down) return; var moved=Math.hypot(e.clientX-down.x,e.clientY-down.y); down=null;
  if(moved>6) return;
  if(measure.on){ measureClick(e); return; }
  var o=pick(e); if(!o) return;
  var fk=FINDS[o.userData.findId]; if(fk && fk.kind==='strata') select(o.userData.findId,false,o.userData.layer); else select(o.userData.findId,true);
});
canvas.addEventListener('pointermove',function(e){
  if(!hasGL||e.pointerType!=='mouse'||down||measure.on) return;
  var o=pick(e), id=o?o.userData.findId:null;
  if(id!==hoverId){ if(hoverId&&tagEls[hoverId]) tagEls[hoverId].classList.remove('hover'); hoverId=id; sizesDirty=true; if(id&&tagEls[id]) tagEls[id].classList.add('hover'); canvas.style.cursor=id?'pointer':''; }
});

/* ------------------------------------------------------------------
   Arranque y bucle
------------------------------------------------------------------ */
function readSceneColor(){ return getComputedStyle(document.documentElement).getPropertyValue('--scene').trim()||'#D6E6EE'; }
function resize(){
  if(!hasGL) return;
  var w=stage.clientWidth, h=stage.clientHeight; if(!w||!h) return;
  renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); sizesDirty=true;
  app.classList.toggle('compact', w<640 || h<420);
}
function ease(k){ return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2; }
function loop(now){
  requestAnimationFrame(loop);
  if(anim){
    var k=Math.min(1,(now-anim.t0)/anim.dur), e=ease(k);
    controls.target.lerpVectors(anim.ft,anim.tt,e); camera.position.lerpVectors(anim.fp,anim.tp,e);
    if(k>=1) anim=null;
  }
  controls.update();
  if(ringMesh.visible && !RM){ var p=1+Math.sin(now/320)*.06; ringMesh.scale.x=ringMesh.scale.y=(FINDS[state.id]&&FINDS[state.id].ring||1)*p; }
  if(!app.classList.contains('conj-mode')){
    renderer.render(scene,camera);
    placeLabels(stage.clientWidth,stage.clientHeight);
    placeMeasure(stage.clientWidth,stage.clientHeight);
  }
}

var YAC_ERR=validarYacimiento();
if(YAC_ERR.length && window.console) console.warn('[yacimiento] '+YAC_ERR.length+' problema(s) en el archivo de datos:\n- '+YAC_ERR.join('\n- '));
hasGL = (typeof THREE!=='undefined') && initThree();
if(hasGL){
  scene.background=new THREE.Color(readSceneColor());
  if(window.matchMedia){ var mq=window.matchMedia('(prefers-color-scheme: dark)'); var upd=function(){ scene.background=new THREE.Color(readSceneColor()); }; if(mq.addEventListener) mq.addEventListener('change',upd); }
  buildLabels();
  applySector();
  if('ResizeObserver' in window) new ResizeObserver(resize).observe(stage); else window.addEventListener('resize',resize);
  resize(); requestAnimationFrame(loop);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ sizesDirty=true; });
} else {
  $('#nogl').hidden=false; canvas.style.display='none'; $('#dock').style.display='none';
  tagEls={}; ORDER.forEach(function(id){ tagEls[id]=document.createElement('span'); });
}
applyLang();
})();
